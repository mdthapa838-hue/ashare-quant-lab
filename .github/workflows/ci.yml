name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    # 固定 ubuntu-24.04：ubuntu-latest 已升级到 26.04，其上没有 Python 3.9
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不钉死 pandas/numpy 版本：代码同时兼容 pandas 2.0+numpy 1.26
          # 与 pandas 2.3+numpy 2.x（两者本地与 CI 均已实测通过）。
          # 钉死 "pandas<2.1" 会在 Python 3.12 上无 wheel 可用而编译失败。
          pip install pandas numpy pyyaml tushare pytest

      - name: Show versions
        run: |
          python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      - name: Run tests (offline)
        run: python -m pytest tests -q

      - name: CLI smoke test (no network)
        run: |
          python -m tushare_trader --help
          python -m tushare_trader backtest --help
