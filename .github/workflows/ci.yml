name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    # 固定 ubuntu-24.04：ubuntu-latest 已升级到 26.04，其上没有 Python 3.9
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy<2 以兼容 pandas<2.1 的二进制接口
          pip install "pandas<2.1" "numpy<2" pyyaml tushare pytest

      - name: Run tests (offline)
        run: python -m pytest tests -q

      - name: CLI smoke test (no network)
        run: |
          python -m tushare_trader --help
          python -m tushare_trader backtest --help
